name: Portable checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.1'
      - name: Formatting, compilation and static checks
        run: |
          test -z "$(gofmt -l cmd internal web/assets.go runtime/assets.go)"
          go build ./cmd/... ./internal/... ./web ./runtime ./tools/...
          go vet ./cmd/... ./internal/... ./web ./runtime ./tools/...
      - name: CPU-only protocol fixtures (not hardware qualification)
        run: >-
          go test -race -count=1
          -run '^(TestBrowserSession.*|TestSettings.*|TestConversation.*|TestChatConversation.*|TestDownload.*|TestProtected(DefaultPreservesDirtyAndUntracked|ExplicitDirectAndRemoteBlock|SnapshotBoundaries|ApplyExactVerifiedCandidate|ApplyFailsClosed|AgentClaimIsNotVerification|SinglePiScopeReservation|ChangedTestsRequireAcknowledgement|ManualVerifyAndReviewAPI|ReviewAfterRestartNeverAdoptsRoot)|TestToolEnvelopeAdmission|TestToolPlainTextParts|TestToolNumbersNotRounded|TestGLMToolsParsedOnlyAfterNaturalEnd|TestToolAdapterUsesPairedRawTokens|TestExplicitChatSettings|TestRuntimeTokenAdmission|TestTokenizerFailureNeverDispatches)$'
          ./cmd/... ./internal/... ./web ./runtime ./tools/...
      - name: Browser logic and mock harness tests (no inference)
        run: |
          node --check web/app.js
          node --check runtime/pi-launch.mjs
          node --test web/tests/*.test.mjs benchmarks/*.test.mjs
